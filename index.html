<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EOrbit · when satellites image your area</title>
  <meta name="description" content="Plan Earth observation overpasses on a 3D globe: when Sentinel, Landsat, CBERS and other missions image your area, with the viewing geometry, the Sun and the clouds.">
  <!-- The servers the globe and the forecast need first. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin>
  <link rel="preconnect" href="https://celestrak.org" crossorigin>
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The font does not hold the scripts back: text shows in the fallback until it arrives. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" onload="this.onload = null; this.rel = 'stylesheet'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link data-trunk rel="css" href="style.css">
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="eorbit" data-type="main" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals">
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="worker" data-type="worker" data-loader-shim data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals">
</head>
<body>
  <div id="globe"></div>
  <div id="credits"></div>
</body>
</html>
